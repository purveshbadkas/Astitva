<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Criminal | Astitva</title>
  <!-- ✅ Updated CSS path -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/add_criminal.css') }}" />
</head>
<body>

  <!-- 🌌 Particle Background -->
  <div id="particles-js"></div>

  <!-- 🔐 Glowing Add Criminal Form -->
  <div class="add-criminal-container">
    <h2>➕ Add New Criminal</h2>
    <form method="POST" enctype="multipart/form-data">
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="number" name="age" placeholder="Age" required />
      <input type="text" name="crime" placeholder="Crime Type" required />
      <input type="text" name="location" placeholder="Location" required />
      <input type="text" name="arrest_date" placeholder="Arrest Date (YYYY-MM-DD)" required />
      <input type="text" name="status" placeholder="Status (e.g. Jailed, Released)" required />
      <input type="file" name="photo" accept="image/*" required />
      <button type="submit">Add Criminal</button>
    </form>
    <p><a href="/dashboard">⬅ Back to Dashboard</a></p>
  </div>

  <!-- 💠 Particle Script -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="{{ url_for('static', filename='js/particles-config.js') }}"></script>
</body>
</html>
